apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: quad-assignment-db
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-202601120807-standard-trixie@sha256:5ecf65aab93827e334c4ae9b4bb09d2ac9fdfa0eef03745fc7184cbf1d1d5ef5
  bootstrap:
    initdb:
      database: quad_assignment
      owner: quad_assignment
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
