# Infrastructure-owned: copy into infrastructure/argocd/applications/ and include
# it in that repository's root Kustomization. This file is NOT in this overlay.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quad-assignment
  namespace: argocd
  # Deliberately no cascading-deletion finalizer.
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: quad-assignment
  source:
    repoURL: https://github.com/KurzaCationer/quad-assignment.git
    targetRevision: main
    path: deploy/overlays/production
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
