apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: quad-assignment
  namespace: quad-assignment
  labels:
    infrastructure.kurza.nl/public-dns: 'true'
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: public-ingress
      sectionName: dylannas-nl-https
  hostnames:
    - quad.dylannas.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ''
          kind: Service
          name: quad-assignment-backend
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: quad-assignment-frontend
          port: 80
          weight: 1
