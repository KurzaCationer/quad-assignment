name: Build and deployment

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - '**/*.md'
      - '.github/workflows/manifests.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - '**/*.md'
      - '.github/workflows/manifests.yml'

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify backend and export schema without Quinoa
        run: bash mvnw -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: target/openapi/
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/main/webui/.nvmrc
          cache: npm
          cache-dependency-path: src/main/webui/package-lock.json
      - name: Build frontend from exported schema
        working-directory: src/main/webui
        run: |
          cp ../../../target/openapi/openapi.json openapi.json
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: target/quarkus-app/
          if-no-files-found: error

  images:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.backend.outputs.digest }}
      frontend: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: target/quarkus-app/
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: target/openapi/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build backend for ARM64 and AMD64
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: kurza/quad-assignment-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend for ARM64 and AMD64
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.frontend
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: kurza/quad-assignment-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # After merge, commit image digests for Argo CD.
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.token }}
          ref: main
      - name: Update image digests
        env:
          BACKEND_DIGEST: ${{ needs.images.outputs.backend }}
          FRONTEND_DIGEST: ${{ needs.images.outputs.frontend }}
        working-directory: deploy/overlays/production
        run: |
          [[ "$BACKEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('kustomization.yaml')
          content = path.read_text()
          for component in ('backend', 'frontend'):
              pattern = rf'(  - name: kurza/quad-assignment-{component}\n)(?:    (?:newTag|digest): [^\n]+\n)+'
              replacement = rf'\g<1>    digest: {os.environ[component.upper() + "_DIGEST"]}\n'
              content, count = re.subn(pattern, replacement, content)
              assert count == 1, f'Expected exactly one {component} image entry'
          path.write_text(content)
          PY
      - name: Commit image references for Argo CD
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/overlays/production/kustomization.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deploy): update images from $SOURCE_SHA"
          git push origin HEAD:main
