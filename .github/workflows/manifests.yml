name: Deployment manifests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0
      - run: kubectl kustomize deploy/overlays/production > /dev/null
