quarkus.quinoa.package-manager-install.node-version=24.19.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.ui-root-path=/
%prod.quarkus.quinoa=false
quarkus.quinoa.dev-server.check-timeout=60000
quarkus.quinoa.dev-server.logs=true
quarkus.quinoa.dev-server.port=7000
quarkus.rest.path=/api

%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:7000
%dev.quarkus.http.port=7001

quarkus.smallrye-openapi.store-schema-directory=target/openapi
%dev.quarkus.smallrye-openapi.store-schema-directory=src/main/webui/
%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.http.port=8080
# Keep health checks on a separate port.
%prod.quarkus.management.enabled=true
%prod.quarkus.management.host=0.0.0.0
%prod.quarkus.management.port=9000

quarkus.cache.caffeine.service-categories.expire-after-write=1h
quarkus.cache.caffeine.endpoint-categories.expire-after-write=1h
quarkus.cache.caffeine.endpoint-questions.expire-after-write=5s
quarkus.rest-client.open-trivia-api.url=https://opentdb.com
quarkus.rest-client.open-trivia-api.scope=jakarta.inject.Singleton

quarkus.hibernate-orm.schema-management.strategy=none
%dev.quarkus.datasource.devservices.port=15432

quarkus.flyway.baseline-on-migrate=true
%test.quarkus.flyway.clean-at-start=true
%dev.quarkus.flyway.clean-at-start=true
quarkus.flyway.migrate-at-start=true
